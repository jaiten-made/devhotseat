# Single package: this file exists only to carry pnpm settings.

# Postinstall scripts are blocked by default. Each was read before deciding.
#   esbuild        - needed: places the platform binary.
#   @google/genai  - not needed: ships a prebuilt dist.
#   protobufjs     - not needed: only prints a version-scheme warning.
allowBuilds:
  esbuild: true
  '@google/genai': false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@google/genai@2.18.0'
  - '@rolldown/binding-darwin-x64@1.2.5'
  - '@rolldown/binding-linux-arm64-gnu@1.2.5'
  - '@vitejs/plugin-react@6.1.0'
  - vite@8.2.2
