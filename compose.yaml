# Local Postgres for development and tests. The app itself is not containerised:
# it runs on the host with `pnpm dev`, because the Vite dev server and the
# Playwright suite both expect a native toolchain.
#
# These credentials are deliberately weak and committed. The port is bound to
# the loopback address only, so nothing here is reachable off this machine.
services:
  postgres:
    image: postgres:18-alpine
    container_name: devhotseat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devhotseat
      POSTGRES_PASSWORD: devhotseat
      POSTGRES_DB: devhotseat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data in a major-version subdirectory, so the
      # mount goes at /var/lib/postgresql, not /var/lib/postgresql/data.
      - devhotseat-pgdata:/var/lib/postgresql
      # Runs once, on an empty data directory only.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      # `docker compose up -d --wait` blocks until this passes, so migrations
      # can run on the next line without a sleep.
      test: ["CMD-SHELL", "pg_isready -U devhotseat -d devhotseat"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  devhotseat-pgdata:
