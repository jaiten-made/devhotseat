services:
  app:
    build: .
    container_name: devhotseat-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://devhotseat:devhotseat@postgres:5432/devhotseat
      AI_PROVIDER: ${AI_PROVIDER:-local}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:17-alpine
    container_name: devhotseat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devhotseat
      POSTGRES_PASSWORD: devhotseat
      POSTGRES_DB: devhotseat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devhotseat-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhotseat -d devhotseat"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  devhotseat-pgdata:
